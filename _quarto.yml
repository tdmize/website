# Site configuration for https://www.trentonmize.com
#
# Pages are .qmd files; each one's address matches its path, e.g.
# teaching/cda.qmd -> www.trentonmize.com/teaching/cda
# Stata documentation lives under software/<pkg>/ (edit only software/<pkg>/_src/,
# then run build.do). Render with  quarto render  (or  do build.do render);
# the site is built into docs/, which GitHub Pages serves.

project:
  type: website
  output-dir: docs
  resources:
  - .nojekyll
  - CNAME
website:
  title: Trenton D. Mize
  site-url: https://www.trentonmize.com
