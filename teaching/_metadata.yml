# Settings for the R code on the teaching pages (the R tabs).
# Quarto runs the R chunks when it renders a page; freeze: auto saves the
# results in _freeze/ and reruns a page's R code only when that page changes.
execute:
  freeze: auto
  message: false
  warning: false
knitr:
  opts_chunk:
    comment: ""
    class.output: r-output
    fig.width: 8
    fig.height: 5.5
    dpi: 200
    out.width: "80%"
    R.options:
      width: 100
